packages:
  - 'apps/*'
  - 'packages/*'

catalog:
  '@antfu/eslint-config': ^9.0.0
  '@types/node': ^25.9.1
  axios: '^1.16.1'
  eslint: ^10.4.0
  eslint-flat-config-utils: ^3.2.0
  prettier: ^3.8.3
  typescript: ^6.0.3
  vitest: ^4.1.6
  zod: ^4.4.3

shamefully-hoist: false
strict-peer-dependencies: false

pmOnFail: error
minimumReleaseAge: 10080 # 7 day
minimumReleaseAgeStrict: false
shellEmulator: true
trustPolicy: no-downgrade

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  msw: true
  prisma: true
  simple-git-hooks: true

# chokidar@4.0.2 & 4.0.3 發布時未透過 CI/CD，導致缺少 provenance attestation
# 非供應鏈攻擊，為維護者發布流程問題（v5.0.0 已修復，改用 Trusted Publishing）
# 但 @nestjs/cli v11 明確鎖定 chokidar@4.0.3，無法升級至 v5
# 待 NestJS v12（預計 Q3 2026）支援 ESM 後，可移除此設定並升級 chokidar
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1 # shadcn 依賴的 @babel 套件，發布時缺少 provenance attestation，非供應鏈攻擊
  - reselect@5.1.1 # @base-ui/react 依賴鏈，發布時遺失 provenance attestation（reduxjs/reselect#752），非供應鏈攻擊
